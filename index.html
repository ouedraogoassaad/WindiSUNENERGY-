<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>WindiSunENERGY</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
padding:20px;
overflow-x:hidden;
}

.container{
max-width:1700px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:42px;
font-weight:bold;
color:#38bdf8;
}

.datetime{
text-align:right;
color:#4ade80;
font-size:18px;
font-weight:bold;
}

.card{
background:#07122b;
border:1px solid #16315f;
border-radius:22px;
padding:25px;
margin-bottom:25px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.card h2{
margin-bottom:20px;
color:#38bdf8;
}

.form-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.results-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.input-group{
display:flex;
flex-direction:column;
gap:8px;
}

.input-group label{
font-weight:bold;
}

input,select{
padding:13px;
border:none;
border-radius:12px;
background:#e2e8f0;
font-size:16px;
width:100%;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:12px;
text-align:center;
border-bottom:1px solid #1e3a5f;
}

.add-btn{
background:#22c55e;
border:none;
padding:12px 22px;
border-radius:12px;
font-weight:bold;
cursor:pointer;
color:white;
margin-bottom:20px;
}

.delete-btn{
background:#ef4444;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
transition:0.3s;
}

.delete-btn:hover{
background:#dc2626;
transform:scale(1.05);
}

.action-buttons{
display:flex;
gap:20px;
margin-top:20px;
flex-wrap:wrap;
}

.action-buttons button{
padding:14px 24px;
border:none;
border-radius:12px;
font-weight:bold;
font-size:16px;
cursor:pointer;
color:white;
}

.analyze-btn{
background:#22c55e;
}

.pdf-btn{
background:#2563eb;
}

.result-box{
background:#0b1733;
border:1px solid #2d4d7d;
border-radius:20px;
padding:24px;
text-align:center;
}

.result-box h3{
margin-bottom:12px;
}

.result-value{
font-size:30px;
font-weight:bold;
color:white;
}

canvas{
background:#081325;
border-radius:22px;
}

#solarPathCanvas{
width:100%;
height:420px;
display:block;
}

.footer{
text-align:center;
margin-top:30px;
font-weight:bold;
}

.hidden-parameters{
display:none;
}

@media(max-width:1100px){

.form-grid,
.results-grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:700px){

.form-grid,
.results-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<div class="logo">
WindiSunENERGY
</div>

<div class="datetime"
id="datetime"></div>

</div>

<!-- PROJECT INFORMATION -->

<div class="card">

<h2>Project Information</h2>

<div class="form-grid">

<div class="input-group">
<label>Client Name</label>
<input id="clientName">
</div>

<div class="input-group">
<label>Phone Number</label>
<input id="clientPhone"
placeholder="+233 XX XXX XXXX">
</div>

<div class="input-group">
<label>Email Address</label>
<input id="clientEmail"
type="email"
placeholder="client@email.com">
</div>

<div class="input-group">
<label>Project Date</label>
<input id="projectDate"
type="date">
</div>

<div class="input-group">
<label>Project Type</label>

<select id="projectType">

<option>Residential</option>
<option>Commercial</option>
<option>Industrial</option>

</select>

</div>

<div class="input-group">
<label>Operation Mode</label>

<select id="operationMode">

<option>OFF-GRID</option>
<option>ON-GRID</option>
<option>HYBRID</option>

</select>

</div>

</div>

</div>

<!-- SOLAR PATH -->

<div class="card">

<h2>Solar Path Tracking</h2>

<canvas id="solarPathCanvas"></canvas>

</div>

<!-- LOADS -->

<div class="card">

<h2>Electrical Loads</h2>

<button class="add-btn"
onclick="addEmptyDevice()">

Add Device

</button>

<table>

<thead>

<tr>

<th>Device</th>
<th>Power (W)</th>
<th>Qty</th>
<th>Day Hours</th>
<th>Night Hours</th>
<th>Delete</th>

</tr>

</thead>

<tbody id="deviceTableBody"></tbody>

</table>

</div>

<!-- HIDDEN PARAMETERS -->

<div class="hidden-parameters">

<input id="panelWattage">

<input id="systemVoltage">

<input id="batteryDod">

<input id="energyEfficiency">

<input id="inverterEfficiency">

<input id="autonomyDays">

<input id="sunHours">

</div>

<!-- ACTIONS -->

<div class="card">

<div class="action-buttons">

<button class="analyze-btn"
onclick="calculateSystem()">

Analyze Project

</button>

<button class="pdf-btn">

Export PDF

</button>

</div>

</div>

<!-- RESULTS -->

<div class="card">

<h2>ESS System Results</h2>

<div class="results-grid">

<div class="result-box">

<h3>Total Power</h3>

<div class="result-value"
id="totalPower">

0 W

</div>

</div>

<div class="result-box">

<h3>Total Energy</h3>

<div class="result-value"
id="totalEnergy">

0 kWh

</div>

</div>

<div class="result-box">

<h3>Day Energy</h3>

<div class="result-value"
id="dayEnergy">

0 kWh

</div>

</div>

<div class="result-box">

<h3>Night Energy</h3>

<div class="result-value"
id="nightEnergy">

0 kWh

</div>

</div>

</div>

</div>

<!-- CHART -->

<div class="card">

<h2>Consumption Analysis</h2>

<canvas id="energyChart"></canvas>

</div>

<div class="footer">

WindiSunENERGY ©️

</div>

</div>

<script>

let chart;

// DATE TIME

function updateDateTime(){

const now = new Date();

document.getElementById(
"datetime"
).innerHTML =

now.toLocaleDateString()
+
"<br>"
+
now.toLocaleTimeString();

}

setInterval(updateDateTime,1000);

updateDateTime();

// ADD DEVICE

function addDevice(
device="",
power=0,
qty=0,
day=0,
night=0
){

const table =
document.getElementById(
"deviceTableBody"
);

const row =
document.createElement("tr");

row.innerHTML = `

<td>
<input value="${device}">
</td>

<td>
<input type="number"
value="${power}">
</td>

<td>
<input type="number"
value="${qty}">
</td>

<td>
<input type="number"
value="${day}">
</td>

<td>
<input type="number"
value="${night}">
</td>

<td>

<button class="delete-btn"
onclick="deleteRow(this)">

✖

</button>

</td>

`;

table.appendChild(row);

}

function addEmptyDevice(){

addDevice();

}

function deleteRow(button){

button.parentElement.parentElement.remove();

}

// WINDOW LOAD

window.onload = function(){

addEmptyDevice();

drawSolarPath();

// AUTO DATE

document.getElementById(
"projectDate"
).value =
new Date()
.toISOString()
.split('T')[0];

// HIDDEN PARAMETERS

document.getElementById(
"panelWattage"
).value = 615;

document.getElementById(
"systemVoltage"
).value = 48;

document.getElementById(
"batteryDod"
).value = 80;

document.getElementById(
"energyEfficiency"
).value = 85;

document.getElementById(
"inverterEfficiency"
).value = 95;

document.getElementById(
"autonomyDays"
).value = 1;

document.getElementById(
"sunHours"
).value = 5;

};

// CALCULATIONS

function calculateSystem(){

const rows =
document.querySelectorAll(
"#deviceTableBody tr"
);

let totalDay = 0;
let totalNight = 0;
let totalPower = 0;

let labels = [];
let values = [];

rows.forEach(row=>{

const inputs =
row.querySelectorAll("input");

const power =
parseFloat(inputs[1].value)||0;

const qty =
parseFloat(inputs[2].value)||0;

const hrsDay =
parseFloat(inputs[3].value)||0;

const hrsNight =
parseFloat(inputs[4].value)||0;

const devicePower =
power * qty;

totalPower += devicePower;

const energyDay =
devicePower * hrsDay;

const energyNight =
devicePower * hrsNight;

totalDay += energyDay;

totalNight += energyNight;

labels.push(
inputs[0].value || "Device"
);

values.push(
((energyDay+energyNight)/1000)
.toFixed(2)
);

});

// TOTAL ENERGY

const totalEnergy =
(totalDay+totalNight)/1000;

// RESULTS

document.getElementById(
"totalPower"
).innerHTML =
totalPower.toFixed(0)
+ " W";

document.getElementById(
"totalEnergy"
).innerHTML =
totalEnergy.toFixed(1)
+ " kWh";

document.getElementById(
"dayEnergy"
).innerHTML =
(totalDay/1000).toFixed(1)
+ " kWh";

document.getElementById(
"nightEnergy"
).innerHTML =
(totalNight/1000).toFixed(1)
+ " kWh";

updateChart(labels,values);

}

// CHART

function updateChart(labels,data){

const ctx =
document.getElementById(
"energyChart"
);

if(chart){
chart.destroy();
}

chart = new Chart(ctx,{

type:'bar',

data:{

labels:labels,

datasets:[{

label:'Energy Consumption (kWh)',

data:data,

backgroundColor:[

'#38bdf8',
'#22c55e',
'#facc15',
'#fb7185',
'#a78bfa',
'#f97316',
'#14b8a6'

],

borderRadius:12

}]

},

options:{

responsive:true,

plugins:{

legend:{
labels:{
color:'white'
}
}

},

scales:{

x:{
ticks:{
color:'white'
},
grid:{
color:'#16315f'
}
},

y:{
ticks:{
color:'white'
},
grid:{
color:'#16315f'
}
}

}

}

});

}

// SOLAR PATH

function drawSolarPath(){

const canvas =
document.getElementById(
"solarPathCanvas"
);

const ctx =
canvas.getContext("2d");

canvas.width =
canvas.offsetWidth;

canvas.height = 420;

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle = "#081325";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

const centerX =
canvas.width / 2;

const centerY = 350;

const radius = 280;

// ARC

ctx.beginPath();

ctx.strokeStyle = "#38bdf8";

ctx.lineWidth = 5;

ctx.arc(
centerX,
centerY,
radius,
Math.PI,
2 * Math.PI
);

ctx.stroke();

// TIME

const now = new Date();

let hour =
now.getHours()
+
(now.getMinutes()/60);

const sunrise = 6;
const sunset = 18;

let progress =
(hour - sunrise)
/
(sunset - sunrise);

if(progress < 0){
progress = 0;
}

if(progress > 1){
progress = 1;
}

const angle =
Math.PI + (Math.PI * progress);

// SUN POSITION

const sunX =
centerX
+
Math.cos(angle) * radius;

const sunY =
centerY
+
Math.sin(angle) * radius;

// GLOW

ctx.beginPath();

ctx.fillStyle =
"rgba(250,204,21,0.25)";

ctx.arc(
sunX,
sunY,
60,
0,
Math.PI*2
);

ctx.fill();

// SUN

ctx.beginPath();

ctx.fillStyle = "#facc15";

ctx.arc(
sunX,
sunY,
28,
0,
Math.PI*2
);

ctx.fill();

// LABELS

ctx.fillStyle = "white";

// SUNRISE

ctx.font = "24px Arial";

ctx.fillText(
"🌅 Sunrise",
70,
330
);

ctx.font = "20px Arial";

ctx.fillStyle = "#cbd5e1";

ctx.fillText(
"06:00",
95,
360
);

// SOLAR PEAK

ctx.fillStyle = "white";

ctx.font = "24px Arial";

ctx.fillText(
"☀️ Solar Peak",
(centerX)-90,
70
);

ctx.font = "20px Arial";

ctx.fillStyle = "#cbd5e1";

ctx.fillText(
"12:00",
(centerX)-10,
100
);

// SUNSET

ctx.fillStyle = "white";

ctx.font = "24px Arial";

ctx.fillText(
"🌇 Sunset",
canvas.width-210,
330
);

ctx.font = "20px Arial";

ctx.fillStyle = "#cbd5e1";

ctx.fillText(
"18:00",
canvas.width-150,
360
);

}

setInterval(drawSolarPath,1000);

drawSolarPath();

</script>

</body>

</html>
